"Khai Vị Đa Dạng", "points": ["Italian Classic Meatballs (198K): Viên thịt heo gia vị truyền thống của những người bà nước Ý, dùng kèm Parmesan, húng quế và bánh mì chua Sourdough.", "Marinated Olives with Crispy Focaccia (198K): Ô liu trộn ướp dầu EVO ăn kèm Focaccia nướng củi.", "Truffle & Cheddar Loaded Fries (179K) & Rosemary & Parmesan Fries (159K): Khoai tây chiên phủ thịt xông khói sốt Cheddar–Truffle, hoặc lắc Parmesan & lá hương thảo."]}], "narration": "Học phần 6A: Các món khai vị Starters. Khay tổng hợp Antipasto Platter, Cheeses Platter và Cold Cuts Focaccia quy tụ tinh hoa thịt nguội và phô mai Ý. Mussels in Pepper Sauce là vẹm nấu sốt tiêu đen và rượu vang kiểu miền Nam Ý. Taleggio in Carrozza là phô mai Taleggio tẩm bột chiên giòn ăn kèm Parma Ham. Arancini là cơm viên chiên giòn vùng Sicily nhồi nhân Nduja cay và Mozzarella kéo sợi. Cùng mực chiên giòn, tôm chiên giòn chấm sốt Tartare và khoai tây chiên sốt phô mai Truffle.", "audio_key": "slide_16"}, {"id": 17, "section": "HỌC PHẦN 6B • MÓN XÀ LÁCH (SALADS)", "title": "7 Món Salad Tươi Mát Chuẩn Vị Địa Trung Hải (Trang 18–20)", "subtitle": "Sự kết hợp tinh tế giữa phô mai tươi, dầu ô liu EVO, giấm Balsamic và rau xanh", "items": [{"name": "Classic Caprese Salad (Insalata Caprese)", "sub": "363K | 125g Phô mai sữa trâu Ý, Cà chua, Húng quế, Dầu EVO & Balsamic", "img": "caprese_salad", "badge": "Đảo Capri • Phổ biến TG", "points": ["Nguồn gốc: Ra đời tại đảo Capri (vịnh Naples) thập niên 1920, mang 3 màu cờ Ý.", "Nguyên liệu: Nguyên khối 125g Buffalo Mozzarella trên cà chua thái lát, húng quế tươi, dầu EVO và giấm Balsamic (có thể thêm Parma Ham 24 tháng +159K)."], "flavor": "Tươi mát thanh khiết: vị béo ngậy mọng sữa của phô mai sữa trâu quyện vị chua ngọt của cà chua chín, mùi thơm húng quế và giấm Balsamic."}, {"name": "Burrata Salad with Pesto Sauce", "sub": "339K | 125g Burrata Ý, Cà chua sô-cô-la, Rocket, Pesto & Focaccia", "img": "burrata_salad", "badge": "Best Seller Salad", "points": ["Nguyên liệu & Đặc trưng: Nguyên quả 125g Burrata đặt trên cà chua sô-cô-la (vỏ nâu đỏ, cùi dày ngọt đậm) và rau Rocket, kèm chén sốt Pesto thơm bùi và bánh Focaccia nướng củi."]}, {"name": "Parma Ham & Sweet Melon (Prosciutto e Melone)", "sub": "298K | Parma Ham 24 tháng, Dưa lưới ngọt, Grissini & Balsamic", "img": "parma_ham_melon", "badge": "Kinh Điển Mùa Hè Ý", "points": ["Nguồn gốc: Món ăn mùa hè kinh điển của người Ý có từ thời La Mã cổ đại (cân bằng thực phẩm tính hàn – ẩm như dưa lưới với thực phẩm tính nhiệt – mặn như thịt muối)."], "flavor": "Sự tương phản tuyệt diệu: vị mặn dịu, béo ngậy umami của đùi heo muối 24 tháng làm bật lên vị ngọt mát, mọng nước thơm lừng của dưa lưới."}, {"name": "Bacon Caesar Salad (224K) & Australian Beef Steak Salad (435K)", "sub": "Xà lách Romaine sốt kem Caesar cùng Bacon hoặc Bò Rib-eye Úc", "img": "bacon_caesar_salad", "badge": "Phổ biến TG", "points": ["Nguồn gốc: Sáng tạo năm 1924 bởi đầu bếp người Ý Caesar Cardini.", "Nguyên liệu: Xà lách Romaine giòn trộn thịt xông khói, bánh mì nướng croutons, trứng nghiền, Parmesan bào và sốt Caesar (bản Beef Steak đặt thêm bít tết bò Rib-eye Úc áp chảo lên trên)."], "flavor": "Rau Romaine giòn ngọt thấm đẫm sốt Caesar béo ngậy, mặn thơm vị Parmesan, điểm nhấn giòn rụm của croutons và bacon."}, {"name": "Chicken Salad in Spiced Yogurt (219K) & Italian Mixed Salad (138K)", "sub": "Salad gà Cajun sốt sữa chua & Salad trộn dầu giấm Ý", "img": "chicken_yogurt_salad", "badge": "Healthy & Thanh Đạm", "points": ["Chicken Salad in Spiced Yogurt (219K): Xà lách & rau Rocket phủ gà áp chảo tẩm gia vị Cajun cay thơm, khoai lang nướng, đậu gà (chickpeas), ớt chuông, dưa leo và sốt sữa chua.", "Italian Mixed Salad (138K): Xà lách trộn cà chua sô-cô-la và ô liu nhập khẩu trong dầu ô liu EVO và giấm Balsamic ủ lâu."]}], "narration": "Học phần 6B: Bảy món Salad tươi mát. Classic Caprese Salad đến từ đảo Capri gồm phô mai sữa trâu tươi, cà chua và húng quế. Burrata Salad đặt nguyên quả Burrata 125 gam trên cà chua sô cô la kèm sốt Pesto. Parma Ham và Sweet Melon là sự tương phản kinh điển giữa đùi heo muối 24 tháng mặn dịu và dưa lưới ngọt mát. Bacon Caesar Salad và Australian Beef Steak Salad dùng sốt kem Caesar đậm đà, cùng Salad gà Cajun sốt sữa chua và Salad trộn kiểu Ý.", "audio_key": "slide_17"}, {"id": 18, "section": "HỌC PHẦN 6C • BÁNH MÌ & GOURMET FOCACCIAS", "title": "Bánh Mì Ý & Bánh Focaccia Cao Cấp Nướng Củi (Trang 21–24)", "subtitle": "8 món bánh mì khai vị và Focaccia vùng Liguria nướng trong lò củi rực lửa", "items": [{"name": "Classic Italian Bruschetta", "sub": "99K | Bánh mì nướng xát tỏi, Cà chua chín, Húng quế & Dầu EVO", "img": "bruschetta", "badge": "Đọc là 'Brus-kết-ta'", "points": ["Nguồn gốc & Phát âm: Xuất xứ miền Trung nước Ý từ thế kỷ 15; âm 'ch' trong tiếng Ý đọc là 'k' ('Brus-kết-ta', từ chữ 'bruscare' nghĩa là nướng trên than hồng).", "Chế biến: Bánh mì nướng giòn xát tỏi tươi, phủ cà chua chín cắt hạt lựu ướp lá húng quế và dầu ô liu EVO."], "flavor": "Bánh mì giòn rụm thơm mùi tỏi và dầu ô liu, bên trên mát lạnh vị chua ngọt tươi mới của cà chua và húng quế."}, {"name": "Buttery Garlic Bread & Fried Pizza with Cheesy Sauce", "sub": "99K | Bánh mì bơ tỏi nướng giòn & Sợi bột Pizza chiên sốt phô mai cay", "img": "fried_pizza_strings", "badge": "Giòn Tan Hấp Dẫn", "points": ["Buttery Garlic Bread (99K - Phổ biến TG): Bánh mì phết đẫm bơ tỏi thơm ngát nướng giòn; vị béo ngậy của bơ quyện hương tỏi nướng.", "Fried Pizza with Cheesy Sauce (99K - Đặc sản đường phố Naples): Bột bánh pizza tươi cắt thành từng dải dài đem chiên phồng vàng ươm, chấm sốt phô mai cay."]}, {"name": "Artisanal Crunchy Focaccia & Rosemary EVO Oil Focaccia", "sub": "99K | Bánh mì dẹt truyền thống vùng Liguria nướng lò củi", "img": "focaccia_rosemary", "badge": "Vùng Liguria • Phổ biến TG", "points": ["Nguồn gốc & Cách làm: Đặc sản vùng Genoa (Liguria) từ chữ Latin 'panis focacius' (bánh nướng lò củi); bột nhào dầu ô liu, ấn tạo lúm nhỏ trên mặt và nướng lò củi giòn rụm."], "flavor": "Đế bánh giòn xốp, thơm nức mùi lá hương thảo tươi (rosemary), dầu ô liu nguyên chất và hương khói gỗ."}, {"name": "Pesto, Eggs and Arugula Gourmet Focaccia", "sub": "129K | Focaccia sốt Pesto húng quế, Trứng tươi & Rau Rocket", "img": "focaccia_pesto_egg", "badge": "Gourmet Focaccia", "points": ["Nét đặc trưng: Kết hợp lớp sốt Pesto húng quế đậm đà, trứng tươi béo bùi và rau Rocket (arugula) the cay nhẹ bên trên mặt bánh Focaccia giòn."]}, {"name": "Gorgonzola, Walnuts & Honey / Truffle & Mozzarella Focaccia", "sub": "129K & 119K | 2 phiên bản Gourmet Focaccia phô mai cao cấp", "img": "focaccia_gorgonzola", "badge": "Béo Ngậy Sang Trọng", "points": ["Gorgonzola, Walnuts and Honey (129K): Phô mai xanh Gorgonzola béo mặn quyện hạt óc chó giòn và mật ong ngọt thanh.", "Truffle and Mozzarella (119K): Hỗn hợp sốt nấm Truffle đen sang trọng kết hợp phô mai Mozzarella tan chảy."]}], "narration": "Học phần 6C: Bánh mì và Focaccia cao cấp nướng lò củi. Classic Italian Bruschetta đọc là Brus-kết-ta, gồm bánh mì nướng xát tỏi phủ cà chua tươi và dầu ô liu. Buttery Garlic Bread thơm nức bơ tỏi. Fried Pizza with Cheesy Sauce là sợi bột pizza chiên phồng chấm sốt phô mai cay. Đặc biệt là dòng bánh mì dẹt Focaccia vùng Liguria với 4 hương vị cao cấp: lá hương thảo dầu ô liu, sốt Pesto trứng và rau Rocket, phô mai xanh Gorgonzola mật ong óc chó, và nấm Truffle phô mai Mozzarella.", "audio_key": "slide_18"}, {"id": 19, "section": "HỌC PHẦN 6D • COMFORT FOODS & MÓN CHÍNH", "title": "Món Ăn Thân Thuộc, Món Chính Âu & Góc Việt Nam (Trang 43–50)", "subtitle": "Lasagna đút lò, Sườn heo Milanese, Bò Rib-eye Tagliata, Cá hồi đút lò & Bò Né", "items": [{"name": "Classic Bolognese Lasagna", "sub": "298K | Mì lá xếp lớp nướng sốt thịt Bolognese, Béchamel & Parmesan", "img": "bolognese_lasagna", "badge": "Bologna • Phổ biến TG", "points": ["Nguồn gốc: Niềm tự hào của vùng Emilia-Romagna (Bắc Ý).", "Cấu trúc & Chế biến: Xếp chồng nhiều lớp lá mì tươi xen kẽ sốt thịt hầm Bolognese, sốt kem trắng Béchamel (nấu từ bơ, bột mì, sữa tươi) và Parmesan, đút lò xém vàng (có thể thêm 1/3 quả Burrata +76K)."], "flavor": "Mềm mượt, béo ngậy và ấm áp: vị đậm đà chua ngọt của sốt thịt Bolognese hòa quyện độ béo kem của sốt Béchamel và lớp phô mai nướng thơm lừng."}, {"name": "Pork Chop alla Milanese (Cotoletta alla Milanese)", "sub": "459K | Sườn cốt-lết heo tẩm bột chiên giòn, Salad Rocket & Sốt chanh mật ong", "img": "pork_chop_milanese", "badge": "Milan 1134 • Phổ biến TG", "points": ["Nguồn gốc: Món chính biểu tượng của thành Milan (Lombardy) từ năm 1134.", "Chế biến: Nguyên miếng sườn heo có xương đập mềm, áo bột chiên xù vàng giòn, ăn kèm salad rau Rocket và sốt chanh mật ong."], "flavor": "Lớp vỏ bột vàng giòn tan khóa chặt phần thịt sườn bên trong mềm mọng nước, quyện vị chua thanh – ngọt dịu của sốt chanh mật ong và rau Rocket the mát."}, {"name": "Beef Tagliata 300gr (689K) & Beef Flank Steak 250gr (298K)", "sub": "2 tuyệt phẩm Bít tết bò nướng kèm khoai tây & salad", "img": "beef_tagliata", "badge": "Steak Thượng Hạng", "points": ["Beef Tagliata 300gr (689K - Đặc sản Tuscany): 'Tagliata' nghĩa là 'cắt lát'; bò Rib-eye Úc nhiều vân mỡ nướng lửa lớn rồi thái lát dày, dùng kèm salad Rocket, khoai tây múi cau và sốt nấm đậm đà.", "Beef Flank Steak 250gr (298K): Phần thớ thịt bò săn chắc, cực kỳ đậm vị bò (beefy flavor), nướng chuẩn độ chín, ăn kèm khoai tây chiên vàng giòn và salad xanh."]}, {"name": "Passion Fruit Salmon (527K) & Golden Pumpkin Soup (129K)", "sub": "Cá hồi đút lò sốt chanh dây & Súp bí đỏ nướng kem tươi", "img": "passion_fruit_salmon", "badge": "Tinh Tế & Bổ Dưỡng", "points": ["Passion Fruit Salmon (527K): Phi lê cá hồi đút lò da giòn thịt mềm ẩm, phục vụ cùng măng tây xanh (asparagus), khoai tây nướng và sốt chanh dây chua thanh cắt béo.", "Golden Pumpkin Soup (129K): Bí đỏ nướng lò cô đặc vị ngọt đem xay mịn cùng kem tươi, trang trí lá húng quế và ăn kèm bánh Focaccia giòn."]}, {"name": "Grilled Prawns (319K), Grilled Sausages (198K) & Bò Né Nướng (139K)", "sub": "Tôm nướng sốt tỏi, Xúc xích heo nướng & Bò Né chảo gang", "img": "grilled_pork_sausages", "badge": "Nướng Lửa Hồng", "points": ["Grilled Prawns in Garlic Sauce (319K): Tôm tươi nướng mềm phủ sốt bơ tỏi đậm đà và chanh tươi.", "Grilled Pork Sausages (198K): Xúc xích heo tươi kiểu Ý nướng xém vỏ mọng nước, kèm khoai tây múi cau, bánh que Grissini, hương thảo và sốt mù tạt (mustard).", "Bò Né Nướng (139K - Góc Việt Nam): Bò thái lát mềm mọng trên chảo gang nóng xèo xèo cùng trứng ốp la, pate gan và bánh mì giòn."]}], "narration": "Học phần 6D: Món ăn thân thuộc và Món chính. Classic Bolognese Lasagna xếp nhiều lớp mì nướng cùng sốt thịt Bolognese, sốt kem trắng Bechamel và Parmesan. Golden Pumpkin Soup là súp bí đỏ nướng xay mịn. Về món chính: Pork Chop alla Milanese là sườn heo có xương tẩm bột chiên giòn biểu tượng thành Milan. Beef Tagliata là bò Rib-eye Úc 300 gam nướng cắt lát kèm sốt nấm. Cùng Beef Flank Steak 250 gam, cá hồi đút lò sốt chanh dây, tôm nướng sốt tỏi, xúc xích heo nướng và Bò Né Nướng.", "audio_key": "slide_19"}, {"id": 20, "section": "HỌC PHẦN 6E • TRÁNG MIỆNG & BÍ QUYẾT PAIR RƯỢU", "title": "4 Món Tráng Miệng (Desserts) & Quy Tắc Tư Vấn Thực Chiến", "subtitle": "Kết thúc ngọt ngào chuẩn Ý (Trang 52) và cẩm nang Upselling cho nhân viên", "items": [{"name": "Italian Moka Tiramisù", "sub": "139K | Kem phô mai Mascarpone, Bánh Ladyfingers ngâm Espresso & Sô-cô-la bào", "img": "tiramisu", "badge": "Số 1 Nước Ý • Phổ biến TG", "points": ["Nguồn gốc & Ý nghĩa tên: Ra đời tại Treviso (Veneto); 'Tiramisù' nghĩa là 'Hãy vực tôi dậy / Làm tôi tỉnh táo và hạnh phúc lên'.", "Cách làm: Xếp lớp bánh quy xốp Savoiardi (Ladyfingers) nhúng cà phê Espresso pha bằng ấm Moka truyền thống, xen kẽ kem phô mai tươi Mascarpone và phủ sô-cô-la bào."], "flavor": "Mềm tan như mây trong miệng: vị béo ngậy mượt mà của Mascarpone hòa quyện vị đắng thơm nồng nàn của Espresso và hậu vị ngọt đắng quyến rũ của sô-cô-la."}, {"name": "Basil Pa     function playChunkedOnlineOrFallbackTTS(text, onDone) {
      const parts = text.match(/[^.,;:]+[.,;:]?/g) || [text];

          if (cur) chunks.push(cur);
          cur = p.trim();
        }
      }
      if (cur) chunks.push(cur);

      let cIdx = 0;
      function playNextChunk() {
        if (!activeCardBtn || cIdx >= chunks.length) {
          if (onDone) onDone();
          return;
        }
        const q = encodeURIComponent(chunks[cIdx++]);
        cardAudio.src = `https://translate.google.com/translate_tts?ie=UTF-8&tl=vi&client=tw-ob&q=${q}`;
        cardAudio.playbackRate = playbackSpeed;
        cardAudio.onended = playNextChunk;
        cardAudio.onerror = () => {
          speakWithBrowserTTS(text, onDone);

        });

      const voices = window.speechSynthesis.getVoices();
      const viVoice = voices.find(v => v.lang && v.lang.toLowerCase().includes('vi'));
      if (viVoice) u.voice = viVoice;
      u.onend = () => { if (onDone) onDone(); };
      u.onerror = () => { if (onDone) onDone(); };
      window.speechSynthesis.speak(u);
    }

    /* TOC & Search Modals */
    function openTocModal() {
      const list = document.getElementById('tocList');
      list.innerHTML = SLIDES.map((s, i) => `
        <div class="toc-item ${i === currentSlideIdx ? 'current' : ''}" onclick="closeTocModal(); renderSlide(${i}, isPlayingLecture);">
          <div style="display:flex; align-items:center; gap:12px;">
            <div class="toc-num">${i + 1}</div>
            <div>
              <div style="font-size:11.5px; color:var(--gold); font-weight:700;">${s.section}</div>
              <div style="font-size:15px; font-weight:700; color:#fff;">${s.title}</div>
              <div style="font-size:12.5px; color:var(--text-muted);">${s.items.length} mục chi tiết</div>
            </div>
          </div>
          <span style="color:var(--gold-light); font-size:18px;">➔</span>
        </div>
      `).join('');
      document.getElementById('tocModal').classList.add('open');
    }

    function closeTocModal() {
      document.getElementById('tocModal').classList.remove('open');
    }

    function openSearchModal() {
      document.getElementById('searchModal').classList.add('open');
      const inp = document.getElementById('searchInput');
      inp.value = '';
      runSearch('');
      setTimeout(() => inp.focus(), 100);
    }

    function closeSearchModal() {
      document.getElementById('searchModal').classList.remove('open');
    }

    function runSearch(query) {
      const q = query.trim().toLowerCase();
      const resEl = document.getElementById('searchResults');
      const matches = [];
      SLIDES.forEach((s, sIdx) => {
        s.items.forEach((item, iIdx) => {
          const hay = `${item.name} ${item.sub || ''} ${(item.points || []).join(' ')} ${item.flavor || ''}`.toLowerCase();
          if (!q || hay.includes(q)) {
            matches.push({ sIdx, iIdx, slideTitle: s.title, item });
          }
        });
      });

      resEl.innerHTML = matches.slice(0, 35).map(m => `
        <div class="toc-item" onclick="closeSearchModal(); renderSlide(${m.sIdx}, false); setTimeout(() => { const el = document.getElementById('slide-card-${m.iIdx}'); if(el){ el.scrollIntoView({behavior:'smooth', block:'center'}); el.classList.add('active-reading'); } }, 250);">
          <div style="display:flex; align-items:center; gap:12px;">
            <div class="toc-num">S${m.sIdx + 1}</div>
            <div>
              <div style="font-size:15px; font-weight:700; color:#fff;">${m.item.name}</div>
              <div style="font-size:12.5px; color:var(--gold-light);">${m.item.sub || m.slideTitle}</div>
            </div>
          </div>
          <span style="color:var(--gold-light); font-size:14px;">Xem ➔</span>
        </div>
      `).join('') || '<div style="padding:20px; text-align:center; color:var(--text-muted);">Không tìm thấy kết quả phù hợp.</div>';
    }

    /* Image Lightbox */
    function openLightbox(imgKey, caption) {
      const src = getImgSrc(imgKey);
      if (!src) return;
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightboxCaption').textContent = caption;
      document.getElementById('lightboxModal').classList.add('open');
    }

    function closeLightbox() {
      document.getElementById('lightboxModal').classList.remove('open');
    }

    /* Keyboard & Mobile Touch Swipe Navigation */
    window.addEventListener('keydown', e => {
      if (document.querySelector('.modal-backdrop.open')) {
        if (e.key === 'Escape') {
          closeTocModal(); closeSearchModal(); closeLightbox();
        }
        return;
      }
      if (e.key === 'ArrowRight') nextSlide();
      else if (e.key === 'ArrowLeft') prevSlide();
      else if (e.key === ' ') {
        e.preventDefault();
        togglePlayLecture();
      }
    });

    let touchStartX = 0;
    let touchStartY = 0;
    window.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    window.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].screenX - touchStartX;
      const dy = e.changedTouches[0].screenY - touchStartY;
      if (Math.abs(dx) > 75 && Math.abs(dx) > Math.abs(dy) * 1.8) {
        if (dx < 0) nextSlide();
        else prevSlide();
      }
    }, { passive: true });

    // Initialize Slide 1
    renderSlide(0, false);
  </script>
</body>
</html>
